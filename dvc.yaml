stages:

  collect_history:

    cmd: python code/datasets/collect_history.py

    outs:
      - data/raw/weather_history.csv

  prepare:
    cmd: python code/datasets/prepare_dataset.py

    deps:
      - code/datasets/prepare_dataset.py
      - data/raw/weather_history.csv

    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python code/models/train.py

    deps:
      - code/models/train.py
      - data/processed/train.csv
      - data/processed/test.csv

    outs:
      - models/model.pkl

    metrics:
      - metrics/metrics.json:
          cache: false